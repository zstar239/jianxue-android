plugins { id 'com.android.application' }

android {
    namespace 'org.jianxue.ime'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.jianxue.ime'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-dev'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    if (System.getenv('JIANXUE_DEBUG_KEYSTORE')) {
        signingConfigs.debug.storeFile = file(System.getenv('JIANXUE_DEBUG_KEYSTORE'))
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    androidResources { noCompress += ['qj', 'qjm'] }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/assets') } }
}

tasks.register('prepareAssets', Sync) {
    into layout.buildDirectory.dir('generated/assets')
    from('../vendor/qingjian/data/generated') { include 'dict.qj', 'lm.qj', 'glossary-*.qj', 'dicts/*.qj', 'codes/stroke.qj' }
    from('../vendor/qingjian/data/models/hanzhang-tongbian') {
        include 'hanzhang-tongbian-small.qjm'
        rename { 'model.qjm' }
    }
    from('../vendor/qingjian/assets/lexicon') { include 'english.tsv' }
    from('../vendor/qingjian/assets/wubi') { include 'wubi86.tsv' }
    from('../vendor/qingjian/assets/emoji') { include 'emoji-zh.tsv' }
    from('../vendor/qingjian/assets/levels') { include 'levels-*.tsv' }
    from('../vendor/qingjian') { include 'LICENSE'; into 'licenses' }
    from('..') { include 'NOTICE.md'; into 'licenses' }
    from('../third-party/rust') {
        include '**/LICENSE*', '**/COPYING*', '**/NOTICE*', '**/COPYRIGHT*'
        into 'licenses/rust'
    }
    from('../vendor/qingjian/assets') {
        include '**/README.md', '**/QINGJIAN.md', '**/*LICENSE*', '**/*COPYING*'
        exclude 'icon/**'
        into 'licenses/data'
    }
    doLast {
        if (!file('../vendor/qingjian/data/generated/dict.qj').exists()) {
            throw new GradleException('缺少正式词库。先运行 bash scripts/dev.sh data')
        }
        if (!file('src/main/jniLibs/arm64-v8a/libjianxue.so').exists()) {
            throw new GradleException('缺少 JNI 引擎。先运行 bash scripts/dev.sh native')
        }
        def directory = layout.buildDirectory.dir('generated/assets').get().asFile
        if (!file('../third-party/rust/.jianxue-complete').exists()) {
            throw new GradleException('缺少完整第三方源码与许可。先运行 bash scripts/dev.sh vendor-dependencies')
        }
        def rows = []
        directory.eachFileRecurse { resource ->
            if (resource.isFile() && resource.name != 'SHA256SUMS') {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                resource.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) != -1) { digest.update(buffer, 0, count) }
                }
                rows.add(digest.digest().encodeHex().toString() + '  ' + directory.toPath().relativize(resource.toPath()).toString().replace('\\', '/'))
            }
        }
        new File(directory, 'SHA256SUMS').text = rows.sort().join('\n') + '\n'
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareAssets' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
