name: Android build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config curl unzip python3 patch ripgrep
      - name: Prepare pinned source and toolchain
        run: |
          bash scripts/fetch-upstream.sh
          bash scripts/dev.sh setup
          bash scripts/dev.sh data
          bash scripts/dev.sh vendor-dependencies
      - name: Validate engine and build Android
        run: |
          bash scripts/dev.sh check
          bash scripts/dev.sh apk
          bash scripts/dev.sh jvm
          python3 scripts/verify-artifacts.py
      - name: Archive corresponding source
        run: |
          python3 scripts/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: jianxue-android-dev
          path: dist/
